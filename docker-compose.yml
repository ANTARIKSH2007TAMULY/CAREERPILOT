version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: careerpilot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: careerpilot
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: careerpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly no

volumes:
  mongo-data:
