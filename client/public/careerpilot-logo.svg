<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" fill="none" width="100%" height="100%">
  <defs>
    <!-- Paper Plane Gradients -->
    <linearGradient id="cplogo-wing-top" x1="12" y1="36" x2="48" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#635BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cplogo-wing-bottom" x1="24" y1="34" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="cplogo-keel" x1="20" y1="32" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="cplogo-text-pilot" x1="140" y1="16" x2="220" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#635BFF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Left Symbol: Aerodynamic Paper Plane -->
  <g transform="translate(4, 2)">
    <!-- Keel -->
    <path d="M 23 35 L 29 42 L 32 35 Z" fill="url(#cplogo-keel)" opacity="0.95"/>
    <!-- Lower wing -->
    <path d="M 46 9 L 23 35 L 36 45 L 46 9 Z" fill="url(#cplogo-wing-bottom)"/>
    <!-- Upper main wing -->
    <path d="M 46 9 L 8 29 L 23 35 L 46 9 Z" fill="url(#cplogo-wing-top)"/>
    <!-- Spine highlight -->
    <path d="M 46 9 L 23 35" stroke="#C7D2FE" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Right Wordmark: CareerPilot -->
  <text x="62" y="36" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.03em" fill="currentColor">
    Career<tspan fill="url(#cplogo-text-pilot)">Pilot</tspan>
  </text>
</svg>
