<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Main wing gradient: Vibrant Royal Blue to Electric Violet -->
    <linearGradient id="cp-wing-top" x1="12" y1="42" x2="56" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#635BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Lower facet gradient: Deep Indigo to Navy Violet -->
    <linearGradient id="cp-wing-bottom" x1="28" y1="42" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Keel / inner fold: Dynamic shadow & dimension -->
    <linearGradient id="cp-keel" x1="24" y1="36" x2="38" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Soft radiant aura -->
    <radialGradient id="cp-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="34" cy="30" r="26" fill="url(#cp-aura)" />

  <!-- Aerodynamic Navigation Paper Plane Symbol -->
  <g transform="translate(1, 0)">
    <!-- Inner Keel / Underbody Fold -->
    <path
      d="M 27 41 L 34 50 L 38 41 Z"
      fill="url(#cp-keel)"
      opacity="0.95"
    />

    <!-- Lower Wing Facet -->
    <path
      d="M 56 10 L 27 41 L 43 54 L 56 10 Z"
      fill="url(#cp-wing-bottom)"
    />

    <!-- Upper Main Wing Facet -->
    <path
      d="M 56 10 L 9 34 L 27 41 L 56 10 Z"
      fill="url(#cp-wing-top)"
    />

    <!-- Center Spine Crease Highlight -->
    <path
      d="M 56 10 L 27 41"
      stroke="#A5B4FC"
      stroke-width="1.25"
      stroke-linecap="round"
      opacity="0.7"
    />
  </g>
</svg>
